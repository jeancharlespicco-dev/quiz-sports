<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Daily Quiz</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="assets/logos/icon-color.svg" type="image/svg+xml">

</head>
<body>

  <!-- Écran sélection joueur -->
  <div class="container" id="screen-player">
   <img
  src="assets/logos/logo-homepage.svg"
  alt="Quiz Sports"
  class="logo-homepage"
/> <h1 class="title">Clique sur ton nom pour rejoindre le quiz</h1>

    <div id="player-grid" class="player-grid"></div>

    <div class="hint">
      Ton choix est mémorisé sur ce navigateur
    </div>
  </div>

  <!-- Écran jeu -->
  <div class="container hidden" id="screen-game">
    <div class="topline">
        <img
    src="assets/logos/logo-black.svg"
    alt="Quiz Sports"
    class="logo-topbar"
  />
      <div class="player-pill" id="player-pill"></div>
      <button class="ghost-btn" id="change-player-btn" type="button">Changer de joueur</button>
      <button class="ghost-btn" id="reset-btn" type="button">Reset</button>
      <button class="ghost-btn" id="stats-btn" type="button">Stats</button>
      <div id="winner-banner" class="winner-banner hidden"></div>

    </div>

    <h1 id="quiz-title">Daily Quiz</h1>
    <p id="quiz-prompt"></p>

    <div id="others" class="others"></div>

<div class="answer-row">
  <input
    id="answer-input"
    type="text"
    placeholder="Réponse..."
    autocomplete="off"
  />
  <div id="my-score" class="my-score">0 / 0</div>
</div>


    <ul id="answers-list"></ul>
  </div>

  <div class="container hidden" id="screen-stats">
  <div class="topline">
    <h1 class="title" style="margin:0;">Stats</h1>
    <div class="top-actions">
      <button class="ghost-btn" id="back-to-game-btn" type="button">Retour</button>
    </div>
  </div>

  <div class="stats-section">
    <h2 class="section-h2">Classement du quiz</h2>
    <div id="quiz-ranking" class="ranking-grid"></div>
  </div>

  <div class="stats-section">
    <h2 class="section-h2">Classement global</h2>
    <div id="global-ranking" class="ranking-grid"></div>
  </div>
</div>


<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
