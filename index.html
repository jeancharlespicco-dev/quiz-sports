<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Daily Quiz</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Écran sélection joueur -->
  <div class="container" id="screen-player">
    <h1 class="title">Qui joue aujourd’hui ?</h1>
    <p class="subtitle">Choisis ton nom pour rejoindre le quiz du jour.</p>

    <div id="player-grid" class="player-grid"></div>

    <div class="hint">
      Astuce : ton choix est mémorisé sur cet ordinateur.
    </div>
  </div>

  <!-- Écran jeu -->
  <div class="container hidden" id="screen-game">
    <div class="topline">
      <div class="player-pill" id="player-pill"></div>
      <button class="ghost-btn" id="change-player-btn" type="button">Changer</button>
    </div>

    <h1 id="quiz-title">Daily Quiz</h1>
    <p id="quiz-prompt"></p>

    <input
      id="answer-input"
      type="text"
      placeholder="Commence à taper..."
      autocomplete="off"
    />

    <div id="progress">0 / 0</div>

<div id="others" class="others"></div>

    <ul id="answers-list"></ul>
  </div>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
