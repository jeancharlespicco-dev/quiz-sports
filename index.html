<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Daily Quiz</title>
  <link rel="stylesheet" href="styles.css?v=20260721-3" />
  <link rel="icon" href="assets/logos/icon-color.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>

  <!-- Splash / Intro -->
<div id="splash" class="splash">
  <div class="splash-inner">
    <img src="assets/logos/logo-homepage.svg" alt="Quiz Sports" class="splash-logo">
    <div class="splash-underline"></div>
  </div>
</div>

  <!-- Écran Home -->
  <div class="container hidden" id="screen-home">
    <div class="home-header">
      <img src="assets/logos/logo-homepage.svg" alt="Quiz Sports" class="logo-homepage" />
    </div>

    <div class="home-quiz-card" id="home-quiz-card">
      <div class="home-quiz-label">Quiz en cours</div>
      <div class="home-quiz-title" id="home-quiz-title">Chargement…</div>
      <div class="home-quiz-prompt" id="home-quiz-prompt"></div>
      <div class="home-quiz-meta" id="home-quiz-meta"></div>
    </div>

    <button class="home-play-btn" id="home-play-btn" type="button">
      <span id="home-play-label">Jouer</span>
      <span class="home-play-arrow">→</span>
    </button>

    <div class="home-nav">
      <button class="home-nav-btn" id="home-stats-btn" type="button">
        <span class="home-nav-icon">🏆</span>
        <span>Classement</span>
      </button>
      <button class="home-nav-btn home-nav-btn--disabled" type="button" title="Bientôt disponible">
        <span class="home-nav-icon">📅</span>
        <span>Historique</span>
      </button>
      <button class="home-nav-btn" id="home-profile-btn" type="button">
        <span class="home-nav-icon">👤</span>
        <span>Profil</span>
      </button>
    </div>

    <div class="home-bottom">
      <div class="hint" id="home-player-hint"></div>
      <button class="home-change-btn" id="home-change-btn" type="button" style="display:none">Changer de joueur</button>
    </div>
  </div>

  <!-- Écran sélection joueur -->
  <div class="container hidden" id="screen-player">
   <img
  src="assets/logos/logo-homepage.svg"
  alt="Quiz Sports"
  class="logo-homepage"
/> <h1 class="title">Clique sur ton nom pour rejoindre le quiz</h1>

    <div id="player-grid" class="player-grid"></div>

    <div class="hint">
      Ton choix est mémorisé sur ce navigateur
    </div>
  </div>

  <!-- Écran jeu -->
  <div class="container hidden" id="screen-game">
    <div class="topline">
        <img
    src="assets/logos/logo-black.svg"
    alt="Quiz Sports"
    class="logo-topbar"
  />
      <div class="player-pill" id="player-pill"></div>
      <button class="ghost-btn" id="home-from-game-btn" type="button">Home</button>
      <button class="ghost-btn" id="change-player-btn" type="button">Changer de joueur</button>
      <button class="ghost-btn" id="stats-btn" type="button">Stats</button>
      <button class="ghost-btn" id="profile-btn" type="button">Profil</button>
          </div>

    <div class="top-notices">
  <div id="winner-banner" class="winner-banner hidden"></div>
  <div id="my-finish-card" class="finish-card hidden"></div>
</div>


    <h1 id="quiz-title">Daily Quiz</h1>
    <p id="quiz-prompt"></p>

    <div id="others" class="others"></div>
    <div id="live-ladder" class="live-ladder" aria-label="Classement en direct"></div>


<div class="answer-row">
  <input
    id="answer-input"
    type="text"
    placeholder="Réponse..."
    autocomplete="off"
  />
  <div id="my-score" class="my-score">0 / 0</div>
</div>


    <ul id="answers-list"></ul>
  </div>

  <div class="container hidden" id="screen-stats">
  <div class="topline">
    <h1 class="title" style="margin:0;">Stats</h1>
    <div class="top-actions">
      <button class="ghost-btn" id="back-to-game-btn" type="button">Retour</button>
    </div>
  </div>

  <div class="stats-section">
    <h2 class="section-h2">Classement du quiz</h2>
    <div id="quiz-ranking" class="ranking-grid"></div>
  </div>

  <div class="stats-section">
    <h2 class="section-h2">Classement global</h2>
    <div id="global-ranking" class="ranking-grid"></div>
  </div>
</div>


  <!-- Écran Profil -->
  <div class="container hidden" id="screen-profile">
    <div class="topline">
      <h1 class="title" style="margin:0;">Profil</h1>
      <div class="top-actions">
        <button class="ghost-btn" id="back-from-profile-btn" type="button">Retour</button>
      </div>
    </div>

    <!-- Sélecteur de joueur -->
    <div class="profile-player-selector" id="profile-player-selector"></div>

    <!-- Carte stats -->
    <div class="profile-stats-grid" id="profile-stats-grid">
      <div class="profile-stat-card">
        <div class="profile-stat-value" id="prof-wins">—</div>
        <div class="profile-stat-label">Victoires</div>
      </div>
      <div class="profile-stat-card">
        <div class="profile-stat-value" id="prof-played">—</div>
        <div class="profile-stat-label">Quiz joués</div>
      </div>
      <div class="profile-stat-card">
        <div class="profile-stat-value" id="prof-best">—</div>
        <div class="profile-stat-label">Meilleur rang</div>
      </div>
    </div>

    <!-- Historique récent -->
    <div class="stats-section">
      <h2 class="section-h2">Historique récent</h2>
      <div id="profile-history" class="profile-history"></div>
    </div>
  </div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="app.js?v=20260721-3"></script>
</body>
</html>
