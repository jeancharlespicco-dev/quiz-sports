<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Daily Quiz</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="container">
    <h1 id="quiz-title">Daily Quiz</h1>
    <p id="quiz-prompt"></p>

    <input
      id="answer-input"
      type="text"
      placeholder="Commence à taper..."
      autocomplete="off"
      autofocus
    />

    <div id="progress">0 / 0</div>

    <ul id="answers-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
