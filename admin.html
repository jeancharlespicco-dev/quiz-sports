<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Quiz Sports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F6F8FC;
      --card: rgba(255,255,255,0.88);
      --card-solid: #FFFFFF;
      --text: #0F172A;
      --muted: rgba(15,23,42,0.55);
      --border: rgba(15,23,42,0.12);
      --border-strong: rgba(15,23,42,0.18);
      --shadow: 0 10px 30px rgba(15,23,42,0.08);
      --primary: #22C55E;
      --primary-600: #16A34A;
      --blue: #4366BB;
      --amber: #EEA825;
      --red: #EF4444;
      --radius: 18px;
      --radius-sm: 12px;
      --focus: 0 0 0 4px rgba(67,102,187,0.18);
      --font: "Inter", system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(900px 600px at 10% -10%, rgba(67,102,187,0.10), transparent 58%),
        radial-gradient(900px 600px at 90% 0%, rgba(115,175,185,0.10), transparent 55%),
        radial-gradient(900px 600px at 40% 120%, rgba(238,168,37,0.08), transparent 55%),
        var(--bg);
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      padding: 34px 16px 60px;
    }

    /* ===== Layout ===== */
    .page {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 24px;
    }

    /* ===== Header ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(67,102,187,0.10);
      border: 1px solid rgba(67,102,187,0.20);
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.55);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: border-color .15s, color .15s;
    }
    .back-link:hover { border-color: rgba(67,102,187,0.28); color: var(--text); }

    /* ===== Gate (mot de passe) ===== */
    #gate {
      min-height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
    }

    #gate h2 { font-size: 18px; font-weight: 700; }
    #gate p { color: var(--muted); font-size: 14px; }

    .gate-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 340px;
    }

    /* ===== Forms / inputs ===== */
    input[type="text"],
    input[type="password"],
    textarea,
    select {
      width: 100%;
      padding: 10px 12px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      outline: none;
      transition: box-shadow .15s, border-color .15s;
    }
    input:focus, textarea:focus, select:focus {
      border-color: rgba(67,102,187,0.55);
      box-shadow: var(--focus);
    }
    textarea { resize: vertical; min-height: 72px; line-height: 1.5; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .field { display: flex; flex-direction: column; gap: 0; }

    /* ===== Buttons ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      border: none;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s, transform .08s;
      white-space: nowrap;
    }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary { background: var(--blue); color: white; }
    .btn-primary:hover:not(:disabled) { opacity: 0.88; }

    .btn-success { background: var(--primary); color: white; }
    .btn-success:hover:not(:disabled) { background: var(--primary-600); }

    .btn-ghost {
      background: rgba(255,255,255,0.55);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-ghost:hover:not(:disabled) { border-color: rgba(67,102,187,0.28); }

    .btn-danger { background: rgba(239,68,68,0.10); border: 1px solid rgba(239,68,68,0.20); color: var(--red); }
    .btn-danger:hover:not(:disabled) { background: rgba(239,68,68,0.18); }

    .btn-amber { background: rgba(238,168,37,0.12); border: 1px solid rgba(238,168,37,0.25); color: #92680a; }
    .btn-amber:hover:not(:disabled) { background: rgba(238,168,37,0.22); }

    .btn-sm { padding: 6px 10px; font-size: 13px; }

    /* ===== Section titles ===== */
    .section-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ===== Quiz list ===== */
    .quiz-list { display: flex; flex-direction: column; gap: 8px; }

    .quiz-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.65);
      transition: border-color .15s;
    }
    .quiz-row:hover { border-color: rgba(67,102,187,0.20); }

    .quiz-row-info { flex: 1; min-width: 0; }
    .quiz-row-title {
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .quiz-row-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .quiz-row-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }
    .status-pill.current {
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.28);
      color: #15803D;
    }
    .status-pill.current::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: 999px;
      background: var(--primary);
    }
    .status-pill.draft {
      background: rgba(15,23,42,0.06);
      border: 1px solid rgba(15,23,42,0.12);
      color: var(--muted);
    }
    .status-pill.archived {
      background: rgba(238,168,37,0.08);
      border: 1px solid rgba(238,168,37,0.20);
      color: #92680a;
    }

    /* ===== Editor ===== */
    #editor { display: none; }
    #editor.is-open { display: block; }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
    }
    .editor-header h2 { font-size: 17px; font-weight: 800; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    .form-grid .span-2 { grid-column: span 2; }

    /* ===== Items editor ===== */
    .items-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 20px 0 12px;
    }
    .items-header h3 {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .item-list { display: flex; flex-direction: column; gap: 8px; }

    .item-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 8px;
      align-items: start;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.55);
    }

    .item-row .item-num {
      grid-column: span 4;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .item-row .remove-item {
      align-self: center;
      background: none;
      border: none;
      color: rgba(239,68,68,0.5);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      border-radius: 6px;
      transition: color .15s, background .15s;
      line-height: 1;
    }
    .item-row .remove-item:hover { color: var(--red); background: rgba(239,68,68,0.08); }

    /* ===== Editor footer ===== */
    .editor-footer {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .editor-footer-right { margin-left: auto; display: flex; gap: 10px; }

    /* ===== Preview ===== */
    #preview-panel {
      display: none;
      padding: 16px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(67,102,187,0.18);
      background: rgba(67,102,187,0.04);
      margin-top: 16px;
    }
    #preview-panel.is-open { display: block; }
    #preview-panel h4 {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--blue);
      margin-bottom: 10px;
    }
    .preview-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .preview-prompt { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .preview-items {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .preview-item {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.72);
      font-size: 13px;
      font-weight: 600;
    }

    /* ===== Toast ===== */
    #toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(10px);
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(15,23,42,0.92);
      color: white;
      font-size: 13px;
      font-weight: 650;
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 14px 40px rgba(15,23,42,0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      z-index: 9999;
      white-space: nowrap;
    }
    #toast.is-show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== Empty state ===== */
    .empty {
      text-align: center;
      padding: 32px 16px;
      color: var(--muted);
      font-size: 14px;
    }

    /* ===== Divider ===== */
    .divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

    /* ===== Responsive ===== */
    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .span-2 { grid-column: span 1; }
      .item-row { grid-template-columns: 1fr auto; }
      .item-row .item-num { grid-column: span 2; }
      .item-row input:nth-child(3),
      .item-row input:nth-child(4) { grid-column: span 1; }
      .preview-items { grid-template-columns: 1fr; }
      .editor-footer-right { margin-left: 0; width: 100%; }
      .quiz-row-actions { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- Header -->
  <div class="card header">
    <div class="header-left">
      <span class="admin-badge">⚙ Admin</span>
      <h1>Quiz Sports</h1>
    </div>
    <a href="index.html" class="back-link">← Retour au jeu</a>
  </div>

  <!-- Gate (mot de passe) -->
  <div class="card" id="gate-card">
    <div id="gate">
      <div>
        <h2>Accès administration</h2>
        <p style="margin-top:6px">Entre le mot de passe pour accéder à cette page.</p>
      </div>
      <div class="gate-row">
        <input type="password" id="pwd-input" placeholder="Mot de passe…" />
        <button class="btn btn-primary" id="pwd-btn" type="button">Entrer</button>
      </div>
      <p id="pwd-error" style="color:var(--red);font-size:13px;display:none;">Mot de passe incorrect.</p>
    </div>
  </div>

  <!-- Contenu admin (masqué avant auth) -->
  <div id="admin-content" style="display:none; display:flex; flex-direction:column; gap:16px;">

    <!-- Liste des quiz -->
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <div class="section-title" style="margin:0">Tous les quiz</div>
        <button class="btn btn-primary btn-sm" id="new-quiz-btn" type="button">+ Nouveau quiz</button>
      </div>
      <div class="quiz-list" id="quiz-list">
        <div class="empty">Chargement…</div>
      </div>
    </div>

    <!-- Éditeur de quiz -->
    <div class="card" id="editor">
      <div class="editor-header">
        <h2 id="editor-title">Nouveau quiz</h2>
        <button class="btn btn-ghost btn-sm" id="editor-close-btn" type="button">✕ Fermer</button>
      </div>

      <div class="form-grid">
        <div class="field">
          <label for="f-title">Titre</label>
          <input type="text" id="f-title" placeholder="Clubs de Ligue 1" />
        </div>
        <div class="field">
          <label for="f-slug">Identifiant (slug)</label>
          <input type="text" id="f-slug" placeholder="ligue1-2026" />
        </div>
        <div class="field span-2">
          <label for="f-prompt">Consigne</label>
          <input type="text" id="f-prompt" placeholder="Tape les clubs actuellement en Ligue 1" />
        </div>
      </div>

      <!-- Items -->
      <div class="items-header">
        <h3>Réponses <span id="items-count" style="color:var(--blue);font-weight:900"></span></h3>
        <button class="btn btn-ghost btn-sm" id="add-item-btn" type="button">+ Ajouter une réponse</button>
      </div>
      <div class="item-list" id="item-list"></div>

      <!-- Preview -->
      <div id="preview-panel">
        <h4>Aperçu</h4>
        <div class="preview-title" id="prev-title"></div>
        <div class="preview-prompt" id="prev-prompt"></div>
        <div class="preview-items" id="prev-items"></div>
      </div>

      <!-- Footer -->
      <div class="editor-footer">
        <button class="btn btn-ghost" id="preview-btn" type="button">👁 Aperçu</button>
        <div class="editor-footer-right">
          <button class="btn btn-ghost" id="save-draft-btn" type="button">Enregistrer (brouillon)</button>
          <button class="btn btn-success" id="publish-btn" type="button">🚀 Publier comme quiz courant</button>
        </div>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
(() => {
  "use strict";

  // ====== Config ======
  const SUPABASE_URL     = "https://fsuyhrzllhfeomvdbfcp.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzdXlocnpsbGhmZW9tdmRiZmNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MTcwOTUsImV4cCI6MjA5OTA5MzA5NX0.TmPZff6fCdhG1hWJA3Fc0kLTsi7wRwxj_lkp9SkiIOg";
  const ADMIN_PASSWORD   = "quizsports2026";

  // ====== Supabase ======
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ====== State ======
  let quizzes    = [];
  let editingId  = null; // uuid du quiz en cours d'édition, ou null si nouveau
  let items      = [];   // [{ answer, aliases, hints }]

  // ====== DOM ======
  const gateCard     = document.getElementById("gate-card");
  const adminContent = document.getElementById("admin-content");
  const pwdInput     = document.getElementById("pwd-input");
  const pwdBtn       = document.getElementById("pwd-btn");
  const pwdError     = document.getElementById("pwd-error");

  const quizListEl   = document.getElementById("quiz-list");
  const newQuizBtn   = document.getElementById("new-quiz-btn");

  const editor       = document.getElementById("editor");
  const editorTitle  = document.getElementById("editor-title");
  const editorCloseBtn = document.getElementById("editor-close-btn");

  const fTitle       = document.getElementById("f-title");
  const fSlug        = document.getElementById("f-slug");
  const fPrompt      = document.getElementById("f-prompt");
  const itemListEl   = document.getElementById("item-list");
  const itemsCount   = document.getElementById("items-count");
  const addItemBtn   = document.getElementById("add-item-btn");

  const previewBtn   = document.getElementById("preview-btn");
  const previewPanel = document.getElementById("preview-panel");
  const saveDraftBtn = document.getElementById("save-draft-btn");
  const publishBtn   = document.getElementById("publish-btn");

  const toastEl      = document.getElementById("toast");

  // ====== Toast ======
  let toastTimer = null;
  function showToast(msg, duration = 2200) {
    toastEl.textContent = msg;
    toastEl.classList.add("is-show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("is-show"), duration);
  }

  // ====== Auth ======
  function unlock() {
    gateCard.style.display = "none";
    adminContent.style.display = "flex";
    adminContent.style.flexDirection = "column";
    adminContent.style.gap = "16px";
    loadQuizzes();
  }

  pwdBtn.addEventListener("click", () => {
    if (pwdInput.value === ADMIN_PASSWORD) {
      pwdError.style.display = "none";
      unlock();
    } else {
      pwdError.style.display = "block";
      pwdInput.value = "";
      pwdInput.focus();
    }
  });

  pwdInput.addEventListener("keydown", e => {
    if (e.key === "Enter") pwdBtn.click();
  });

  // ====== Load quizzes ======
  async function loadQuizzes() {
    quizListEl.innerHTML = '<div class="empty">Chargement…</div>';

    const { data, error } = await sb
      .from("quizzes")
      .select("id, slug, title, prompt, status, items, created_at")
      .order("created_at", { ascending: false });

    if (error) {
      quizListEl.innerHTML = `<div class="empty" style="color:var(--red)">Erreur : ${error.message}</div>`;
      return;
    }

    quizzes = data || [];
    renderQuizList();
  }

  // ====== Render list ======
  function renderQuizList() {
    if (quizzes.length === 0) {
      quizListEl.innerHTML = '<div class="empty">Aucun quiz pour l\'instant. Crée le premier !</div>';
      return;
    }

    quizListEl.innerHTML = "";

    // current en premier
    const sorted = [...quizzes].sort((a, b) => {
      const order = { current: 0, draft: 1, archived: 2 };
      return (order[a.status] ?? 3) - (order[b.status] ?? 3);
    });

    for (const q of sorted) {
      const row = document.createElement("div");
      row.className = "quiz-row";

      const count = Array.isArray(q.items) ? q.items.length : 0;

      row.innerHTML = `
        <div class="quiz-row-info">
          <div class="quiz-row-title">${esc(q.title)}</div>
          <div class="quiz-row-meta">${esc(q.slug)} · ${count} réponse${count > 1 ? "s" : ""}</div>
        </div>
        <span class="status-pill ${q.status}">${labelStatus(q.status)}</span>
        <div class="quiz-row-actions">
          <button class="btn btn-ghost btn-sm" data-action="edit" data-id="${q.id}">✏️ Modifier</button>
          ${q.status !== "current"
            ? `<button class="btn btn-success btn-sm" data-action="publish" data-id="${q.id}">🚀 Publier</button>`
            : ""}
          ${q.status !== "archived"
            ? `<button class="btn btn-amber btn-sm" data-action="archive" data-id="${q.id}">Archiver</button>`
            : ""}
          <button class="btn btn-danger btn-sm" data-action="delete" data-id="${q.id}">🗑</button>
        </div>
      `;

      quizListEl.appendChild(row);
    }

    // Events sur les boutons de la liste
    quizListEl.querySelectorAll("[data-action]").forEach(btn => {
      btn.addEventListener("click", () => {
        const { action, id } = btn.dataset;
        if (action === "edit")    openEditor(id);
        if (action === "publish") publishQuiz(id);
        if (action === "archive") archiveQuiz(id);
        if (action === "delete")  deleteQuiz(id);
      });
    });
  }

  function labelStatus(s) {
    if (s === "current")  return "En ligne";
    if (s === "archived") return "Archivé";
    return "Brouillon";
  }

  function esc(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // ====== Editor ======
  newQuizBtn.addEventListener("click", () => openEditor(null));
  editorCloseBtn.addEventListener("click", closeEditor);

  function openEditor(id) {
    editingId = id || null;
    items = [];

    if (id) {
      const q = quizzes.find(x => x.id === id);
      if (!q) return;
      editorTitle.textContent = "Modifier le quiz";
      fTitle.value  = q.title  || "";
      fSlug.value   = q.slug   || "";
      fPrompt.value = q.prompt || "";
      items = (q.items || []).map(it => ({ ...it }));
    } else {
      editorTitle.textContent = "Nouveau quiz";
      fTitle.value  = "";
      fSlug.value   = "";
      fPrompt.value = "";
      items = [];
    }

    previewPanel.classList.remove("is-open");
    renderItems();
    editor.classList.add("is-open");
    editor.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function closeEditor() {
    editor.classList.remove("is-open");
    previewPanel.classList.remove("is-open");
    editingId = null;
    items = [];
  }

  // Auto-slug depuis le titre
  fTitle.addEventListener("input", () => {
    if (!editingId) {
      fSlug.value = slugify(fTitle.value);
    }
  });

  function slugify(str) {
    return str
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 60);
  }

  // ====== Items ======
  addItemBtn.addEventListener("click", () => {
    items.push({ answer: "", aliases: [], hints: [] });
    renderItems();
    // focus sur le dernier champ answer
    const inputs = itemListEl.querySelectorAll(".item-answer");
    const last = inputs[inputs.length - 1];
    if (last) { last.focus(); last.scrollIntoView({ behavior: "smooth", block: "center" }); }
  });

  function renderItems() {
    itemListEl.innerHTML = "";
    itemsCount.textContent = `(${items.length})`;

    items.forEach((item, idx) => {
      const row = document.createElement("div");
      row.className = "item-row";

      row.innerHTML = `
        <div class="item-num" style="grid-column:span 4">Réponse ${idx + 1}</div>
        <div class="field">
          <label>Réponse principale</label>
          <input type="text" class="item-answer" value="${esc(item.answer)}" placeholder="Paris Saint-Germain" />
        </div>
        <div class="field">
          <label>Alias (séparés par des virgules)</label>
          <input type="text" class="item-aliases" value="${esc((item.aliases || []).join(", "))}" placeholder="PSG, Paris SG" />
        </div>
        <div class="field">
          <label>Indices (séparés par des virgules)</label>
          <input type="text" class="item-hints" value="${esc((item.hints || []).join(", "))}" placeholder="Capitale, Parc des Princes" />
        </div>
        <button class="remove-item" title="Supprimer" type="button">✕</button>
      `;

      // Sync en temps réel
      row.querySelector(".item-answer").addEventListener("input", e => {
        items[idx].answer = e.target.value.trim();
      });
      row.querySelector(".item-aliases").addEventListener("input", e => {
        items[idx].aliases = e.target.value.split(",").map(s => s.trim()).filter(Boolean);
      });
      row.querySelector(".item-hints").addEventListener("input", e => {
        items[idx].hints = e.target.value.split(",").map(s => s.trim()).filter(Boolean);
      });
      row.querySelector(".remove-item").addEventListener("click", () => {
        items.splice(idx, 1);
        renderItems();
      });

      itemListEl.appendChild(row);
    });
  }

  // ====== Collect form data ======
  function collectFormData() {
    // Sync les champs actuels (au cas où l'événement input n'aurait pas tiré)
    itemListEl.querySelectorAll(".item-row").forEach((row, idx) => {
      if (!items[idx]) return;
      items[idx].answer  = row.querySelector(".item-answer").value.trim();
      items[idx].aliases = row.querySelector(".item-aliases").value.split(",").map(s => s.trim()).filter(Boolean);
      items[idx].hints   = row.querySelector(".item-hints").value.split(",").map(s => s.trim()).filter(Boolean);
    });

    return {
      title:  fTitle.value.trim(),
      slug:   fSlug.value.trim(),
      prompt: fPrompt.value.trim(),
      items:  items.filter(it => it.answer), // ignore les lignes vides
    };
  }

  function validateForm(data) {
    if (!data.title) { showToast("⚠️ Le titre est requis."); fTitle.focus(); return false; }
    if (!data.slug)  { showToast("⚠️ L'identifiant (slug) est requis."); fSlug.focus(); return false; }
    if (data.items.length === 0) { showToast("⚠️ Ajoute au moins une réponse."); return false; }
    return true;
  }

  // ====== Preview ======
  previewBtn.addEventListener("click", () => {
    const data = collectFormData();
    document.getElementById("prev-title").textContent  = data.title  || "—";
    document.getElementById("prev-prompt").textContent = data.prompt || "—";

    const prevItems = document.getElementById("prev-items");
    prevItems.innerHTML = "";
    data.items.forEach(it => {
      const div = document.createElement("div");
      div.className = "preview-item";
      div.textContent = it.answer;
      prevItems.appendChild(div);
    });

    previewPanel.classList.toggle("is-open");
    if (previewPanel.classList.contains("is-open")) {
      previewPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  });

  // ====== Save (brouillon) ======
  saveDraftBtn.addEventListener("click", () => saveQuiz("draft"));

  // ====== Publish ======
  publishBtn.addEventListener("click", () => saveQuiz("current"));

  async function saveQuiz(status) {
    const data = collectFormData();
    if (!validateForm(data)) return;

    saveDraftBtn.disabled = true;
    publishBtn.disabled   = true;

    try {
      if (status === "current") {
        // D'abord archiver l'ancien current
        await sb.from("quizzes")
          .update({ status: "archived" })
          .eq("status", "current")
          .neq("id", editingId || "00000000-0000-0000-0000-000000000000");
      }

      const payload = {
        title:      data.title,
        slug:       data.slug,
        prompt:     data.prompt,
        items:      data.items,
        status,
        updated_at: new Date().toISOString(),
      };

      let error;
      if (editingId) {
        ({ error } = await sb.from("quizzes").update(payload).eq("id", editingId));
      } else {
        ({ error } = await sb.from("quizzes").insert(payload));
      }

      if (error) throw error;

      const msg = status === "current"
        ? "🚀 Quiz publié ! Il est maintenant en ligne."
        : "✅ Brouillon enregistré.";
      showToast(msg);

      closeEditor();
      await loadQuizzes();

    } catch (e) {
      showToast("❌ Erreur : " + e.message, 4000);
    } finally {
      saveDraftBtn.disabled = false;
      publishBtn.disabled   = false;
    }
  }

  // ====== Publish depuis la liste ======
  async function publishQuiz(id) {
    if (!confirm("Publier ce quiz comme quiz courant ?\n\nL'ancien quiz courant sera archivé automatiquement.")) return;

    try {
      // Archiver l'ancien current
      await sb.from("quizzes").update({ status: "archived" }).eq("status", "current");
      // Publier le nouveau
      const { error } = await sb.from("quizzes").update({ status: "current", updated_at: new Date().toISOString() }).eq("id", id);
      if (error) throw error;
      showToast("🚀 Quiz publié !");
      await loadQuizzes();
    } catch (e) {
      showToast("❌ Erreur : " + e.message, 4000);
    }
  }

  // ====== Archive ======
  async function archiveQuiz(id) {
    if (!confirm("Archiver ce quiz ?")) return;
    try {
      const { error } = await sb.from("quizzes").update({ status: "archived", updated_at: new Date().toISOString() }).eq("id", id);
      if (error) throw error;
      showToast("📦 Quiz archivé.");
      await loadQuizzes();
    } catch (e) {
      showToast("❌ Erreur : " + e.message, 4000);
    }
  }

  // ====== Delete ======
  async function deleteQuiz(id) {
    const q = quizzes.find(x => x.id === id);
    if (!confirm(`Supprimer définitivement "${q?.title || "ce quiz"}" ?\n\nCette action est irréversible.`)) return;
    try {
      const { error } = await sb.from("quizzes").delete().eq("id", id);
      if (error) throw error;
      showToast("🗑 Quiz supprimé.");
      if (editingId === id) closeEditor();
      await loadQuizzes();
    } catch (e) {
      showToast("❌ Erreur : " + e.message, 4000);
    }
  }

})();
</script>
</body>
</html>
